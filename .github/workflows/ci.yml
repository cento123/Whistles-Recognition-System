name: CI - Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements-test.txt

    - name: Cache model weights
      uses: actions/cache@v4
      id: model-cache
      with:
        path: models/best_exp20.pt
        key: wrs-model-best_exp20-v1

    - name: Download model (cache miss)
      if: steps.model-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p models
        python -c "
        import download_test_data, pathlib, sys
        download_test_data.download_via_gdown()
        if not pathlib.Path('models/best_exp20.pt').exists():
            print('WARNING: model download failed; E2E tests requiring the model will fail.', file=sys.stderr)
        else:
            print('Model ready at models/best_exp20.pt')
        "

    - name: Run pytest
      run: |
        pytest tests/ -v --tb=short --strict-markers

    - name: Generate coverage report
      run: |
        pytest tests/ --cov=src --cov=scripts --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
